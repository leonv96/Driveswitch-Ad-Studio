<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driveswitch Ad Studio</title>
    <style>
        :root {
            --ds-blue: #A3C6ED;
            --ds-black: #121212;
            --ds-white: #ffffff;
            --ds-gray: #2c2c2e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .preview-wrapper {
            width: 100%;
            position: relative;
            background: var(--ds-gray);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        canvas {
            width: 100%;
            display: block;
            height: auto;
        }
        .panel {
            background: var(--ds-gray);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group.vertical {
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }
        label { font-size: 14px; font-weight: 500; color: #aeaeb2; }
        input[type="text"], input[type="file"] {
            background: #3a3a3c;
            border: 1px solid #48484a;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            text-align: right;
            font-size: 15px;
            width: 50%;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--ds-blue);
        }
        input[type="file"] { text-align: left; width: auto; border: none; background: transparent; padding: 0; }
        
        input[type="range"] {
            width: 100%;
            accent-color: var(--ds-blue);
            margin: 4px 0 8px 0;
        }

        .preset-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .preset-btn {
            background: #3a3a3c;
            border: 1px solid #48484a;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s ease;
        }
        .preset-btn:active {
            background: #48484a;
        }
        
        .button-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .btn {
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s ease;
        }
        .btn:active { opacity: 0.8; }
        
        #downloadBtn {
            background: var(--ds-blue);
            color: #000000;
            flex: 2;
        }
        #clearBtn {
            background: #3a3a3c;
            color: #ff453a;
            border: 1px solid #48484a;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0; text-align:center; font-weight: 700;">Driveswitch Ad Studio</h2>
    
    <div class="preview-wrapper">
        <canvas id="adCanvas"></canvas>
    </div>
    
    <div class="panel">
        <div class="form-group">
            <label>Select Car Photo</label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        <div class="form-group">
            <label>Deposit (£)</label>
            <input type="text" id="depositInput" placeholder="e.g. 10,000" inputmode="numeric" value="">
        </div>
        <div class="form-group">
            <label>Per Month (£)</label>
            <input type="text" id="monthlyInput" placeholder="e.g. 636" inputmode="decimal" value="">
        </div>

        <div class="form-group vertical">
            <label>Finance Text Size</label>
            <input type="range" id="headerFontSlider" min="24" max="52" value="38">
        </div>
        
        <div class="form-group">
            <label>Show Bottom Banner</label>
            <input type="checkbox" id="toggleBottom" style="transform: scale(1.3);">
        </div>
        
        <div class="preset-container">
            <label style="margin-bottom: 4px;">Quick Select Banners:</label>
            <button class="preset-btn" data-text="Full Service History">📁 Full Service History</button>
            <button class="preset-btn" data-text="12 Months MOT & Fresh Service">🔧 12 Months MOT & Fresh Service</button>
        </div>

        <div class="form-group" id="bottomTextField" style="display: none; flex-direction: column; gap: 10px; align-items: stretch;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>Custom Bottom Text</label>
                <input type="text" id="bottomTextInput" placeholder="e.g. DRIVE AWAY TODAY" style="width:55%; text-align: left;" value="">
            </div>
            <div class="form-group vertical" style="margin-top: 4px;">
                <label>Banner Text Size</label>
                <input type="range" id="bannerFontSlider" min="20" max="48" value="30">
            </div>
        </div>
    </div>
    
    <div class="button-row">
        <button class="btn" id="clearBtn">Clear All</button>
        <button class="btn" id="downloadBtn">Open Image to Save</button>
    </div>
</div>
