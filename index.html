<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driveswitch Ad Studio</title>
    <style>
        :root {
            --ds-blue: #A3C6ED;
            --ds-black: #121212;
            --ds-white: #ffffff;
            --ds-gray: #2c2c2e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .preview-wrapper {
            width: 100%;
            position: relative;
            background: var(--ds-gray);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        canvas {
            width: 100%;
            display: block;
            height: auto;
        }
        .panel {
            background: var(--ds-gray);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label { font-size: 14px; font-weight: 500; color: #aeaeb2; }
        input[type="text"], input[type="file"] {
            background: #3a3a3c;
            border: 1px solid #48484a;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            text-align: right;
            font-size: 15px;
            width: 50%;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--ds-blue);
        }
        input[type="file"] { text-align: left; width: auto; border: none; background: transparent; padding: 0; }
        
        .button-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .btn {
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s ease;
        }
        .btn:active { opacity: 0.8; }
        
        #downloadBtn {
            background: var(--ds-blue);
            color: #000000;
            flex: 2;
        }
        #clearBtn {
            background: #3a3a3c;
            color: #ff453a;
            border: 1px solid #48484a;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0; text-align:center; font-weight: 700;">Driveswitch Ad Studio</h2>
    
    <div class="preview-wrapper">
        <canvas id="adCanvas"></canvas>
    </div>
    
    <div class="panel">
        <div class="form-group">
            <label>Select Car Photo</label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        <div class="form-group">
            <label>Deposit (£)</label>
            <input type="text" id="depositInput" placeholder="e.g. 10,000" inputmode="numeric" value="">
        </div>
        <div class="form-group">
            <label>Per Month (£)</label>
            <input type="text" id="monthlyInput" placeholder="e.g. 636" inputmode="decimal" value="">
        </div>
        <div class="form-group">
            <label>Show Bottom Banner</label>
            <input type="checkbox" id="toggleBottom" style="transform: scale(1.3);">
        </div>
        <div class="form-group" id="bottomTextField" style="display: none;">
            <label>Bottom Text</label>
            <input type="text" id="bottomTextInput" placeholder="e.g. DRIVE AWAY TODAY" style="width:65%; text-align: left;" value="">
        </div>
    </div>
    
    <div class="button-row">
        <button class="btn" id="clearBtn">Clear All</button>
        <button class="btn" id="downloadBtn">Open Image to Save</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('adCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = 1024;
    canvas.height = 768;

    let userImage = null;

    const imageLoader = document.getElementById('imageLoader');
    const depositInput = document.getElementById('depositInput');
    const monthlyInput = document.getElementById('monthlyInput');
    const toggleBottom = document.getElementById('toggleBottom');
    const bottomTextInput = document.getElementById('bottomTextInput');
    const bottomTextField = document.getElementById('bottomTextField');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');

    function formatNumberWithCommas(inputElement) {
        let cursorPosition = inputElement.selectionStart;
        let originalLength = inputElement.value.length;
        
        let cleanValue = inputElement.value.replace(/[^0-9.]/g, '');
        
        let parts = cleanValue.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        
        if (parts[1]) parts[1] = parts[1].substring(0, 2);
        
        inputElement.value = parts.join('.');
        
        let newLength = inputElement.value.length;
        cursorPosition = cursorPosition + (newLength - originalLength);
        inputElement.setSelectionRange(cursorPosition, cursorPosition);
    }

    [depositInput, monthlyInput].forEach(item => {
        item.addEventListener('input', (e) => {
            formatNumberWithCommas(e.target);
            drawAdvert();
        });
    });

    bottomTextInput.addEventListener('input', drawAdvert);
    
    toggleBottom.addEventListener('change', () => {
        bottomTextField.style.display = toggleBottom.checked ? 'flex' : 'none';
        drawAdvert();
    });

    imageLoader.addEventListener('change', (e) => {
        if(e.target.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function(event){
            userImage = new Image();
            userImage.onload = function(){
                drawAdvert();
            }
            userImage.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    function drawAdvert() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (userImage) {
            let imgRatio = userImage.width / userImage.height;
            let canvasRatio = canvas.width / canvas.height;
            let renderWidth, renderHeight, xOffset, yOffset;

            if (imgRatio > canvasRatio) {
                renderHeight = canvas.height;
                renderWidth = userImage.width * (canvas.height / userImage.height);
                xOffset = (canvas.width - renderWidth) / 2;
                yOffset = 0;
            } else {
                renderWidth = canvas.width;
                renderHeight = userImage.height * (canvas.width / userImage.width);
                xOffset = 0;
                yOffset = (canvas.height - renderHeight) / 2;
            }
            ctx.drawImage(userImage, xOffset, yOffset, renderWidth, renderHeight);
        } else {
            ctx.fillStyle = '#2c2c2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 26px system-ui, sans-serif';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText('Tap below to upload a car photo...', canvas.width/2, canvas.height/2);
        }

        // Top Header Base
        ctx.fillStyle = '#121212';
        ctx.fillRect(0, 0, canvas.width, 90);

        // Sidebar Brand Tag
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.font = '900 18px system-ui, sans-serif';
        
        ctx.fillStyle = '#A3C6ED';
        ctx.fillText('FINANCE', 30, 33);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('EXAMPLE', 30, 57);

        // Render Values
        ctx.font = 'bold 28px system-ui, sans-serif';
        
        let depValue = depositInput.value.trim() !== '' ? '£' + depositInput.value : '£0';
        let depLabel = 'DEPOSIT';
        let mthValue = monthlyInput.value.trim() !== '' ? '£' + monthlyInput.value : '£0';
        let mthLabel = 'PER MONTH';

        let wDepValue = ctx.measureText(depValue).width;
        let wDepLabel = ctx.measureText(depLabel).width;
        let wMthValue = ctx.measureText(mthValue).width;
        let wMthLabel = ctx.measureText(mthLabel).width;

        let gapInternal = 12;
        let gapSection = 45;

        let totalBlockWidth = wDepValue + gapInternal + wDepLabel + gapSection + wMthValue + gapInternal + wMthLabel;
        let startX = (canvas.width / 2) - (totalBlockWidth / 2) + 60; 

        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';

        ctx.fillStyle = '#A3C6ED';
        ctx.fillText(depValue, startX, 45);
        startX += wDepValue + gapInternal;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(depLabel, startX, 45);
        startX += wDepLabel + gapSection;

        ctx.fillStyle = '#A3C6ED';
        ctx.fillText(mthValue, startX, 45);
        startX += wMthValue + gapInternal;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(mthLabel, startX, 45);

        // Bottom Banner
        if (toggleBottom.checked && bottomTextInput.value.trim() !== '') {
            ctx.fillStyle = '#121212';
            ctx.fillRect(0, canvas.height - 75, canvas.width, 75);

            ctx.fillStyle = '#A3C6ED';
            ctx.font = '900 24px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(bottomTextInput.value.toUpperCase(), canvas.width / 2, canvas.height - 37.5);
        }
    }

    clearBtn.addEventListener('click', () => {
        userImage = null;
        imageLoader.value = '';
        depositInput.value = '';
        monthlyInput.value = '';
        toggleBottom.checked = false;
        bottomTextField.style.display = 'none';
        bottomTextInput.value = ''; // Fully empty on clear
        drawAdvert();
    });

    drawAdvert();

    downloadBtn.addEventListener('click', () => {
        const imageURI = canvas.toDataURL('image/png');
        const newWindow = window.open();
        if (newWindow) {
            newWindow.document.write(`<img src="${imageURI}" style="width:100%; height:auto;" alt="Driveswitch Advert">`);
            newWindow.document.title = "Save Your Advert";
            newWindow.document.body.style.margin = "0";
            newWindow.document.body.style.background = "#121212";
            newWindow.document.body.style.display = "flex";
            newWindow.document.body.style.alignItems = "center";
            newWindow.document.body.style.height = "100vh";
        } else {
            alert("Please allow pop-ups for this app to save images.");
        }
    });
</script>
</body>
</html>
